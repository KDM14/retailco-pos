name: 'retailco_pos_dbt'
version: '1.0.0'
config-version: 2

profile: 'retailco_pos_profile'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  retailco_pos_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts
      fct_sales:
        +materialized: incremental
        +partition_by:
          field: parsed_date
          data_type: date
          granularity: day
        +cluster_by: ["store_id", "product_code"]
